<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#18212b">
<title>MYSTIA — Lost Port Run</title>
<style>
:root{--deep:#062b43;--sea:#0d5870;--foam:#b9e1dc;--sand:#e6d5b4;--ink:#062438}
*{box-sizing:border-box}html{min-height:100%;background:#041d30}body{margin:0;min-height:100svh;padding:clamp(16px,4vh,42px) 14px 28px;color:var(--sand);font-family:Georgia,"Noto Serif KR",serif;background:radial-gradient(ellipse at 50% 8%,#27758a 0%,#0d4963 34%,#062b43 72%,#031a2b 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none;left:-15%;width:130%;height:180px;border:1px solid #8ed5d044;border-radius:50%;transform:rotate(-5deg)}body:before{top:8%;box-shadow:0 18px 0 #8ed5d018,0 38px 0 #8ed5d012}body:after{bottom:-100px;transform:rotate(4deg);box-shadow:0 -20px 0 #8ed5d018,0 -42px 0 #8ed5d012}
.wrap{position:relative;z-index:1;width:min(100%,980px);margin:0 auto}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 2px 16px}.brand{font-size:clamp(27px,5vw,43px);letter-spacing:.2em;color:#e8f4e8;text-shadow:0 2px 16px #9fe4dc55}.sub{font:11px/1.7 Arial,sans-serif;letter-spacing:.19em;color:#b5d9d9}.badge{border:1px solid #9bd2c888;border-radius:2px;padding:8px 11px;color:#d8ece0;font:10px Arial,sans-serif;letter-spacing:.13em;white-space:nowrap;background:#06354b66}
.frame{border:1px solid #a7d4c477;border-radius:5px;background:linear-gradient(145deg,#0a3c55dd,#06283eee);padding:clamp(5px,1vw,10px);box-shadow:0 18px 55px #00152288,inset 0 0 30px #7bc9c51a}.screen{position:relative;overflow:hidden;border:1px solid #a9d7c677;border-radius:3px;background:#0b5269}canvas{display:block;width:100%;height:auto;aspect-ratio:16/7;image-rendering:pixelated;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(120deg,#042b40b8,#063e52a8);padding:clamp(10px,3vw,24px)}.panel{width:min(100%,460px);background:linear-gradient(150deg,#0b4960ed,#062c43f2);border:1px solid #a9d7c6aa;border-radius:4px;padding:clamp(16px,4vw,30px);box-shadow:0 12px 38px #001b2c99,inset 0 0 25px #8ed5d018}.panel h1{font-size:clamp(23px,5vw,39px);letter-spacing:.12em;margin:0 0 8px;color:#e9e6cc;text-shadow:0 2px 12px #a6d9cf55}.panel p{font:clamp(12px,2vw,15px)/1.9 Arial,sans-serif;color:#d1e5df;margin:8px 0 18px}.btn{min-height:48px;min-width:190px;border:1px solid #c5dfc5;border-radius:3px;background:linear-gradient(180deg,#4e9b9b,#17627a);color:#f2f2df;padding:12px 26px;font-weight:bold;letter-spacing:.15em;cursor:pointer;box-shadow:0 5px 18px #001c2b77}.btn:active{transform:translateY(2px);filter:brightness(1.1)}.hud{display:flex;justify-content:space-between;gap:8px;padding:12px 5px 3px;font:clamp(10px,1.8vw,13px) Arial,sans-serif;letter-spacing:.08em;color:#b9d8d2}.hud strong{color:#f0ead2}.bottom{display:flex;justify-content:space-between;gap:12px;margin:12px 2px 0;color:#a9c9c8;font:11px/1.6 Arial,sans-serif}.touch{display:none;position:absolute;inset:auto 0 0;justify-content:flex-end;padding:10px;pointer-events:none}.touch button{pointer-events:auto;border:1px solid #d3eee0aa;background:#0a435bbd;color:#f3f0d9;border-radius:50%;width:66px;height:66px;font-size:12px;letter-spacing:.08em;touch-action:none;box-shadow:0 3px 14px #001b2b77}
@media(max-width:600px){body{padding:clamp(18px,5vh,54px) 10px 22px}.top{align-items:center;margin-bottom:13px}.brand{font-size:clamp(25px,8vw,36px)}.sub{font-size:9px;letter-spacing:.12em}.badge{font-size:8px;padding:6px 7px;letter-spacing:.08em}.frame{padding:5px}.hud{padding:10px 2px 2px}.bottom{font-size:10px}.touch{display:flex}}
@media(max-width:360px){.badge{display:none}.bottom{font-size:9px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><div class="brand">MYSTIA</div><div class="sub">THE LOST PORT · SURVIVAL RUN</div></div><div class="badge">ANCIENT WORLD / MMORPG</div></header>
  <main class="frame">
    <div class="screen" id="screen">
      <canvas id="game" width="960" height="420" aria-label="미스티아 러닝 게임"></canvas>
      <div class="overlay" id="overlay"><div class="panel">
        <h1>LOST PORT RUN</h1>
        <p>폐허가 된 항구를 가로질러라.<br>둘이 손을 놓치지 않도록, 끝까지 달려!</p>
        <button class="btn" id="start">GAME START</button>
      </div></div>
      <div class="touch"><button id="jump">JUMP</button></div>
    </div>
    <div class="hud"><span> DISTANCE <strong id="distance">00000</strong> m</span><span> BEST <strong id="best">00000</strong> m</span><span id="state">READY</span></div>
  </main>
  <footer class="bottom"><span>SPACE / ↑ / TAP : JUMP</span><span>DON'T LET GO.</span></footer>
</div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
const distEl=document.getElementById('distance'),bestEl=document.getElementById('best'),stateEl=document.getElementById('state');
const W=960,H=420,ground=340;
const world=new Image(),pair=new Image(); world.src='assets/world-sheet.png'; pair.src='assets/pair-sheet.png';
[world,pair].forEach(im=>{im.onload=()=>{if(!running)drawTitle()};im.onerror=()=>{if(!running)drawTitle()};});
let running=false,dead=false,last=0,elapsed=0,distance=0,speed=330,spawn=0,obstacles=[],particles=[],cloudOffset=0,anim=0;
let best=Number(localStorage.getItem('mystia-best')||0);bestEl.textContent=String(best).padStart(5,'0');
const crop={
 // world-sheet.png: source rectangles are intentionally cropped at runtime.
 column:[16,20,98,260], brokenColumn:[130,142,110,140], tallColumn:[390,18,120,265],
 pot:[865,85,145,200], potSmall:[1170,145,90,140], fallen:[16,315,310,150],
 rocks:[345,335,305,125], statue:[680,295,165,170], serpent:[865,315,395,145],
 temple:[10,480,385,215], villa:[410,475,385,215], arch:[800,495,205,200],
 tree:[980,455,230,245], cypress:[1235,465,90,235], palm:[1350,470,175,235],
 cloud:[20,710,190,90], gull:[715,735,105,65], sparkle:[1200,700,170,100],
 gate:[15,815,235,190], aqueduct:[250,815,345,190], banner:[610,820,75,180],
 lamp:[700,815,70,185], planter:[795,835,95,150], crates:[915,900,150,100],
 stall:[1090,830,220,165], dock:[1335,885,175,115]
};
const actors={
 run:[90,425,470,330], // standing hand-holding pair, middle-left pose
 run2:[690,425,510,330], // alternate stance
 fall:[690,155,535,205], // lying/fallen pair
 intro:[100,55,465,330]
};
function drawSheet(img,rect,x,y,w,h,flip=false){
 if(!img.complete||!img.naturalWidth)return;
 ctx.save(); if(flip){ctx.translate(x+w,y);ctx.scale(-1,1);x=0;y=0}
 ctx.drawImage(img,rect[0],rect[1],rect[2],rect[3],x,y,w,h);ctx.restore();
}
function sky(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#78b8c2');g.addColorStop(.52,'#b5d4c9');g.addColorStop(.72,'#6daab0');g.addColorStop(1,'#245d70');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant harbor silhouettes
 ctx.fillStyle='#477f83';ctx.globalAlpha=.42;
 for(let i=0;i<8;i++){let x=i*145-(elapsed*18%145);ctx.fillRect(x,225,90,115);ctx.fillRect(x+18,195,44,30);ctx.fillRect(x+58,208,18,17)}
 ctx.globalAlpha=1;
 // drifting clouds
 for(let i=0;i<4;i++){let x=((i*280-cloudOffset*.35)%(W+180)+W+180)%(W+180)-90;drawSheet(world,crop.cloud,x,48+(i%2)*34,115,54)}
}
function scenery(){
 // distant palm / trees scroll slowly
 for(let i=0;i<4;i++){let x=((i*330-cloudOffset*.55)%(W+220)+W+220)%(W+220)-110;drawSheet(world,i%2?crop.palm:crop.tree,x,ground-170,i%2?105:150,155)}
}
function floor(){
 ctx.fillStyle='#806f59';ctx.fillRect(0,ground,W,H-ground);
 ctx.fillStyle='#d6c69f';ctx.fillRect(0,ground,W,7);
 ctx.fillStyle='#4d5b50';for(let x=-(elapsed*speed%75);x<W;x+=75){ctx.fillRect(x,ground+24,45,3);ctx.fillRect(x+20,ground+55,30,2)}
}
function actor(){
 const bob=running&&!dead?Math.sin(anim*13)*3:0;
 const r=(Math.floor(anim*7)%2===0)?actors.run:actors.run2;
 if(dead)drawSheet(pair,actors.fall,90,ground-122,270,110);
 else drawSheet(pair,r,82,ground-185+bob,285,190);
}
function drawTitle(){ctx.clearRect(0,0,W,H);sky();scenery();floor();drawSheet(pair,actors.intro,90,ground-190,300,195);drawSheet(world,crop.temple,610,ground-195,245,140);drawSheet(world,crop.pot,800,ground-75,70,75)}
function spawnObstacle(){
 const choices=[
  {r:crop.pot,w:64,h:84},{r:crop.brokenColumn,w:65,h:82},{r:crop.rocks,w:105,h:48},
  {r:crop.fallen,w:110,h:60},{r:crop.statue,w:75,h:82},{r:crop.arch,w:100,h:95},
  {r:crop.crates,w:92,h:62},{r:crop.gate,w:110,h:90},{r:crop.stall,w:110,h:88}
 ];
 let c=choices[Math.floor(Math.random()*choices.length)];
 obstacles.push({x:W+25,y:ground-c.h,w:c.w,h:c.h,r:c.r});
 if(Math.random()<.18)obstacles.push({x:W+210,y:ground-145,w:88,h:40,r:crop.serpent,air:true});
}
function draw(){
 ctx.clearRect(0,0,W,H);sky();scenery();
 // harbor skyline ornaments
 drawSheet(world,crop.temple,700,ground-160,180,100);
 floor();
 obstacles.forEach(o=>drawSheet(world,o.r,o.x,o.y,o.w,o.h));
 actor();
 if(dead){ctx.fillStyle='#17212bcc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f5e2bd';ctx.textAlign='center';ctx.font='bold 32px Georgia';ctx.fillText('YOU LOST THE WAY',W/2,150);ctx.font='16px Arial';ctx.fillText('DISTANCE  '+Math.floor(distance)+' m',W/2,185)}
}
function reset(){running=true;dead=false;elapsed=0;distance=0;speed=330;spawn=0;obstacles=[];anim=0;playerY=0;vy=0;overlay.style.display='none';stateEl.textContent='RUNNING';last=performance.now();requestAnimationFrame(loop)}
function jump(){if(!running||dead)return;if(playerY>=-1){vy=-650;}}
let playerY=0,vy=0;
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.035);last=t;elapsed+=dt;anim+=dt;distance+=speed*dt/12;speed=Math.min(620,330+distance*.22);cloudOffset+=dt*22;
 playerY+=vy*dt;vy+=1700*dt;if(playerY>0){playerY=0;vy=0}
 // actor uses playerY as canvas translate
 ctx.save();ctx.translate(0,playerY);
 spawn-=dt;if(spawn<=0){spawnObstacle();spawn=.95+Math.random()*.7-Math.min(.22,distance/1200)}
 obstacles.forEach(o=>o.x-=speed*dt);obstacles=obstacles.filter(o=>o.x+o.w>-20);
 const px=115,py=ground-175+playerY,pw=225,ph=165;
 for(const o of obstacles){let bx=px+32,by=py+35,bw=150,bh=125;if(bx<o.x+o.w-12&&bx+bw>o.x+12&&by<o.y+o.h-8&&by+bh>o.y+8){endGame();break}}
 draw();ctx.restore();
 distEl.textContent=String(Math.floor(distance)).padStart(5,'0');
 if(running)requestAnimationFrame(loop);
}
function endGame(){running=false;dead=true;stateEl.textContent='FALLEN';best=Math.max(best,Math.floor(distance));localStorage.setItem('mystia-best',best);bestEl.textContent=String(best).padStart(5,'0');draw();overlay.style.display='flex';overlay.innerHTML='<div class="panel"><h1>YOU FELL</h1><p>둘은 아직 손을 놓지 않았다.<br>다시 항구를 달릴까?</p><button class="btn" id="again">RETRY</button></div>';document.getElementById('again').onclick=reset}
function doStart(){reset()}
startBtn.addEventListener('click',doStart);
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
canvas.addEventListener('pointerdown',e=>{if(running)jump()});
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!running)doStart();else jump()}});
drawTitle();
})();
</script>
</body>
</html>
