<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07364d">
<title>MYSTIA — Lost Port Run</title>
<style>
:root{color-scheme:light;--foam:#d4eee5;--sand:#d7c39b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{min-height:100svh;padding:clamp(12px,4vh,42px) 10px 26px;color:#111;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
/* Classic 1990s browser shell */
.browser{width:min(100%,1000px);margin:0 auto;background:#c0c0c0;border:2px solid #777;box-shadow:2px 3px 0 #555,0 12px 34px #0002}
.titlebar{height:25px;padding:2px 4px 2px 6px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font: bold 13px Tahoma,Arial,sans-serif;letter-spacing:.01em}
.title-name{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-icon{width:14px;height:14px;flex:0 0 14px;background:linear-gradient(135deg,#fff 0 45%,#7aa6d8 46% 100%);border:1px solid #fff}
.window-controls{display:flex;gap:3px;margin-left:8px}
.window-controls i{display:grid;place-items:center;width:16px;height:15px;background:#c0c0c0;border:1px solid #fff;border-right-color:#555;border-bottom-color:#555;color:#111;font: bold 11px Arial;font-style:normal;line-height:1}
.menubar{height:23px;display:flex;align-items:center;gap:19px;padding:0 7px;background:#c0c0c0;border-bottom:1px solid #888;font:12px Tahoma,Arial,sans-serif;color:#111}
.toolbar{height:34px;display:flex;align-items:center;gap:4px;padding:3px 6px;background:#c0c0c0;border-bottom:2px solid #888;font:12px Tahoma,Arial,sans-serif}
.toolbtn{width:24px;height:23px;display:grid;place-items:center;background:#c0c0c0;border:1px solid #fff;border-right-color:#666;border-bottom-color:#666;color:#222;font:bold 16px Arial}
.address-label{margin-left:7px;white-space:nowrap}
.address{height:22px;min-width:0;flex:1;background:#fff;border:2px inset #eee;padding:2px 6px;color:#222;font:12px Arial,sans-serif;display:flex;align-items:center;justify-content:space-between}
.address .arrow{margin-left:8px;color:#333}
.browser-content{background:#fff;padding:16px 15px 12px;min-height:400px}
.wrap{width:min(100%,940px);margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:0 3px 12px}
.brand{font: bold clamp(27px,6vw,42px) Georgia,'Noto Serif KR',serif;letter-spacing:.22em;color:#426b7b}
.sub{font:10px/1.6 Arial,sans-serif;letter-spacing:.16em;color:#78939a}
.badge{font:9px Arial,sans-serif;letter-spacing:.12em;border:1px solid #a8c5c8;padding:7px 9px;color:#587983;white-space:nowrap}
.frame{padding:6px;border:1px solid #9bbdc0;border-radius:2px;background:linear-gradient(145deg,#d9e7e4,#edf3ed);box-shadow:0 3px 10px #42616b22}
.screen{position:relative;overflow:hidden;border:1px solid #789ca2;background:#73b7bc}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/7;image-rendering:pixelated;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;background:#032b3c99}
.panel{width:min(100%,440px);padding:clamp(15px,4vw,28px);background:linear-gradient(145deg,#0b4b61f2,#052d43f5);border:1px solid #c0e5d5aa;box-shadow:0 10px 35px #001b2c99;color:#e8f0e8}
.panel h1{margin:0 0 8px;font: bold clamp(22px,5vw,36px) Georgia,serif;letter-spacing:.12em;color:#f0ead2}
.panel p{margin:8px 0 17px;font:clamp(12px,2vw,15px)/1.8 Arial,sans-serif;color:#d1e8df}
.btn{min-height:48px;min-width:180px;border:1px solid #d0e7cb;background:linear-gradient(#4b9b9b,#17647a);color:#fff5dc;padding:12px 24px;font-weight:bold;letter-spacing:.14em;touch-action:manipulation}
.btn:active{transform:translateY(2px)}
.hud{display:flex;justify-content:space-between;gap:8px;padding:10px 5px 2px;font:clamp(10px,1.8vw,13px) Arial,sans-serif;letter-spacing:.07em;color:#587983}
.hud strong{color:#244f5e}
.bottom{display:flex;justify-content:space-between;gap:10px;margin:10px 3px 0;color:#78939a;font:10px Arial,sans-serif}
/* Classic desktop-style game-over dialog */
.overlay.retro-overlay{background:#0008;padding:4px;overflow:hidden}
.retro-dialog{width:min(100%,390px);max-height:100%;overflow-y:auto;background:#c0c0c0;border:2px solid #fff;border-right-color:#555;border-bottom-color:#555;box-shadow:3px 4px 0 #1118;text-align:left;color:#111;padding:3px;font-family:Tahoma,Arial,sans-serif}
.retro-title{height:25px;display:flex;align-items:center;justify-content:space-between;padding:2px 6px;background:linear-gradient(90deg,#000080,#1084d0);color:white;font:bold 12px Tahoma,Arial,sans-serif}
.retro-title .x{width:17px;height:17px;display:grid;place-items:center;background:#c0c0c0;border:1px solid white;border-right-color:#555;border-bottom-color:#555;color:#111;font:bold 12px Arial}
.retro-body{padding:clamp(8px,2.2vw,14px) clamp(9px,3vw,16px) 8px;display:flex;gap:10px;align-items:flex-start}
.retro-icon{flex:0 0 34px;height:34px;display:grid;place-items:center;background:#000080;color:#fff;font:bold 23px Georgia;border:2px outset #eee}
.retro-copy{min-width:0}
.retro-copy h1{margin:0 0 6px;color:#111;font:bold clamp(16px,4.2vw,19px) Tahoma,Arial,sans-serif;letter-spacing:0}
.retro-copy p{margin:0;color:#222;font:clamp(11px,3vw,12px)/1.45 Tahoma,Arial,sans-serif}
.retro-actions{display:flex;justify-content:center;padding:0 10px 8px}
.retro-btn{min-width:112px;min-height:36px;padding:6px 16px;background:#c0c0c0;color:#111;border:2px solid #fff;border-right-color:#555;border-bottom-color:#555;font:12px Tahoma,Arial,sans-serif;letter-spacing:0}
.retro-btn:active{border-color:#555 #fff #fff #555;transform:none}
.screen{touch-action:manipulation;cursor:pointer}
.statusbar{height:20px;display:flex;align-items:center;padding:0 7px;background:#c0c0c0;border-top:1px solid #fff;color:#333;font:11px Tahoma,Arial,sans-serif}
.statusbar span{display:inline-block;padding:2px 8px;border:1px inset #eee}
@media(max-width:600px){
 body{padding:10px 5px 16px}
 .browser{width:100%;box-shadow:1px 2px 0 #555}
 .menubar{gap:14px;height:22px}
 .toolbar{height:32px;padding:3px 4px;gap:3px}
 .toolbtn{width:22px;height:22px}
 .browser-content{padding:11px 7px 9px;min-height:0}
 .top{margin-bottom:9px}.brand{font-size:clamp(25px,8vw,36px)}
 .badge{font-size:8px;padding:6px}.frame{padding:4px}
 .hud{padding:9px 2px 2px}.bottom{font-size:9px}
}
@media(max-width:360px){.badge{display:none}.menubar{gap:10px;font-size:11px}.address-label{display:none}.retro-body{gap:8px;padding:8px 8px 6px}.retro-icon{flex-basis:30px;height:30px;font-size:20px}.retro-copy p{font-size:11px;line-height:1.35}.retro-actions{padding-bottom:6px}}
</style>
</head>
<body>
<div class="browser" role="application" aria-label="Mystia browser window">
  <div class="titlebar"><div class="title-name"><span class="title-icon"></span><span>Mystia - The Endless Journey</span></div><div class="window-controls" aria-hidden="true"><i>_</i><i>□</i><i>×</i></div></div>
  <nav class="menubar" aria-label="Browser menu"><span>File</span><span>Edit</span><span>View</span><span>Favorites</span><span>Help</span></nav>
  <div class="toolbar"><span class="toolbtn" aria-hidden="true">‹</span><span class="toolbtn" aria-hidden="true">›</span><span class="toolbtn" aria-hidden="true">⌂</span><span class="address-label">Address:</span><div class="address"><span>https://mystia.lost-port/run</span><span class="arrow">▼</span></div></div>
  <div class="browser-content"><div class="wrap">
<header class="top"><div><div class="brand">MYSTIA</div><div class="sub">THE LOST PORT · SURVIVAL RUN</div></div><div class="badge">ANCIENT WORLD / MMORPG</div></header>
<main class="frame"><div class="screen" id="screen">
<canvas id="game" width="960" height="420" aria-label="미스티아 러닝 게임"></canvas>
<div class="overlay" id="overlay"><div class="panel"><h1>LOST PORT RUN</h1><p>폐허가 된 항구를 가로질러라.<br>둘이 손을 놓치지 않도록, 끝까지 달려!</p><button class="btn" id="start">GAME START</button></div></div>

</div><div class="hud"><span>DISTANCE <strong id="distance">00000</strong> m</span><span>BEST <strong id="best">00000</strong> m</span><span id="state">READY</span></div></main>
<footer class="bottom"><span>CLICK / TAP / SPACE / ↑ : JUMP</span><span>DON'T LET GO.</span></footer>
</div></div>
<div class="statusbar"><span>Done</span></div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),distanceEl=document.getElementById('distance'),bestEl=document.getElementById('best'),stateEl=document.getElementById('state');
const W=960,H=420,G=330;
// Jump SFX: put Sound1.mp3 (or .ogg/.wav/.m4a) beside index.html.
const jumpSfx=new Audio();jumpSfx.preload='auto';
const jumpSoundFiles=['./Sound1.mp3','./Sound1.ogg','./Sound1.wav','./Sound1.m4a'];
let jumpSoundIndex=0;
function loadJumpSound(){if(jumpSoundIndex>=jumpSoundFiles.length)return;jumpSfx.src=jumpSoundFiles[jumpSoundIndex];jumpSfx.onerror=()=>{jumpSoundIndex++;loadJumpSound()};jumpSfx.load()}
loadJumpSound();
function playJumpSound(){if(!jumpSfx.src)return;try{jumpSfx.currentTime=0;const p=jumpSfx.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
ctx.imageSmoothingEnabled=false;
const pair=new Image();pair.src='./pair-sheet.png';
const frames={runA:[90,425,470,330],runB:[690,425,510,330],fall:[690,155,535,205]};
let mode='ready',last=0,time=0,score=0,speed=350,spawnIn=.8,obstacles=[],bubbles=[],playerY=0,vy=0,runFrame=0,bg=0;
let best=0;try{best=Number(localStorage.getItem('mystia-best')||0)}catch(e){}
bestEl.textContent=String(best).padStart(5,'0');
function sprite(rect,x,y,w,h){
 if(pair.complete&&pair.naturalWidth){ctx.drawImage(pair,...rect,x,y,w,h)}
 else drawFallbackPair(x,y,w,h);
}
function drawFallbackPair(x,y,w,h){
 ctx.fillStyle='#1b2026';ctx.fillRect(x+20,y+20,w*.36,h*.8);
 ctx.fillStyle='#e8e6df';ctx.fillRect(x+w*.43,y+12,w*.36,h*.84);
}
function cloud(x,y,s){
 ctx.fillStyle='#e1eee0';ctx.fillRect(x,y+12*s,55*s,15*s);ctx.fillRect(x+12*s,y+3*s,20*s,17*s);ctx.fillRect(x+30*s,y+7*s,22*s,14*s);
 ctx.fillStyle='#a9d1ca';ctx.fillRect(x+4*s,y+24*s,47*s,3*s);
}
function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#83c2c4');g.addColorStop(.62,'#c3dfd0');g.addColorStop(1,'#68aeb3');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant sea and island silhouettes
 ctx.fillStyle='#6eafb2';ctx.fillRect(0,235,W,95);
 ctx.fillStyle='#4f9299';ctx.fillRect(0,270,W,60);
 ctx.fillStyle='#397b87';
 for(let i=0;i<8;i++){let x=((i*155-bg*.16)%(W+180)+W+180)%(W+180)-100;ctx.fillRect(x,195,75,75);ctx.fillRect(x+18,178,40,17)}
 for(let i=0;i<4;i++){let x=((i*285-bg*.28)%(W+150)+W+150)%(W+150)-70;cloud(x,42+(i%2)*45,.8+(i%2)*.25)}
 // temple silhouette
 ctx.fillStyle='#d8d0b8';ctx.fillRect(710,178,155,6);ctx.fillRect(720,150,135,8);
 ctx.beginPath();ctx.moveTo(700,150);ctx.lineTo(788,105);ctx.lineTo(875,150);ctx.closePath();ctx.fill();
 ctx.fillStyle='#8b9c91';for(let x=728;x<850;x+=25)ctx.fillRect(x,158,8,42);
}
function drawSeaDetails(){
 ctx.strokeStyle='#d3eee0';ctx.globalAlpha=.45;ctx.lineWidth=2;
 for(let i=0;i<9;i++){let x=((i*137-bg*.7)%(W+100)+W+100)%(W+100)-40;let y=285+(i%3)*13;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+36,y);ctx.stroke()}
 ctx.globalAlpha=1;
}
function drawGround(){
 ctx.fillStyle='#806f58';ctx.fillRect(0,G,W,H-G);
 ctx.fillStyle='#d6c69f';ctx.fillRect(0,G,W,7);
 ctx.fillStyle='#5c6255';
 for(let x=-(bg%86);x<W;x+=86){ctx.fillRect(x,G+25,46,3);ctx.fillRect(x+25,G+57,36,2);ctx.fillRect(x+58,G+82,20,2)}
 ctx.fillStyle='#9a8668';ctx.fillRect(0,G+112,W,2);
}
function drawObstacle(o){
 const x=Math.round(o.x),y=o.y;
 if(o.type==='urn'){
  ctx.fillStyle='#8c5338';ctx.fillRect(x+13,y+12,38,45);ctx.fillRect(x+7,y+20,8,25);ctx.fillRect(x+49,y+20,8,25);ctx.fillRect(x+20,y+5,24,9);ctx.fillRect(x+17,y+56,30,6);
  ctx.fillStyle='#d5ad78';ctx.fillRect(x+19,y+19,27,3);ctx.fillRect(x+22,y+37,22,3);ctx.fillRect(x+27,y+23,10,13);
 }else if(o.type==='pillar'){
  ctx.fillStyle='#b9b49b';ctx.fillRect(x+12,y+8,38,66);ctx.fillRect(x+5,y,52,10);ctx.fillRect(x+5,y+72,52,8);
  ctx.fillStyle='#8e998d';ctx.fillRect(x+21,y+14,5,55);ctx.fillRect(x+37,y+14,5,55);
 }else if(o.type==='rocks'){
  ctx.fillStyle='#777d70';ctx.fillRect(x+5,y+25,27,23);ctx.fillRect(x+25,y+10,35,38);ctx.fillRect(x+54,y+24,30,24);
  ctx.fillStyle='#a9a58e';ctx.fillRect(x+31,y+14,15,4);ctx.fillRect(x+10,y+29,10,3);
 }else if(o.type==='column'){
  ctx.fillStyle='#b8b49d';ctx.fillRect(x+3,y+28,100,25);ctx.fillRect(x+10,y+18,17,10);ctx.fillRect(x+66,y+53,18,9);
  ctx.fillStyle='#8d998e';ctx.fillRect(x+30,y+34,60,4);
 }else if(o.type==='statue'){
  ctx.fillStyle='#9d9f8b';ctx.fillRect(x+22,y+20,35,58);ctx.fillRect(x+17,y+12,45,12);ctx.fillRect(x+29,y,21,17);ctx.fillRect(x+8,y+75,65,8);
  ctx.fillStyle='#d4c7a5';ctx.fillRect(x+31,y+4,16,4);
 }
}
function drawPlayer(){
 const airborne=playerY<0;
 const bob=airborne?0:Math.sin(runFrame*15)*3;
 const rect=mode==='dead'?frames.fall:(Math.floor(runFrame*9)%2?frames.runA:frames.runB);
 if(mode==='dead')sprite(rect,95,G-126,265,105);
 else{
  // Slight squash on landing, while actual jump is driven by playerY physics.
  const squash=airborne?1:1+Math.sin(runFrame*18)*.012;
  const h=188*squash,w=270/squash;
  sprite(rect,83+(270-w)/2,G-h+bob+playerY,w,h);
 }
}
function draw(){
 ctx.clearRect(0,0,W,H);drawSky();drawSeaDetails();drawGround();
 obstacles.forEach(drawObstacle);
 drawPlayer();
 if(mode==='dead'){
  ctx.fillStyle='#06283dbb';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f3e9ce';ctx.textAlign='center';ctx.font='bold 31px Georgia';ctx.fillText('YOU LOST THE WAY',W/2,150);
  ctx.font='16px Arial';ctx.fillText('DISTANCE  '+Math.floor(score)+' m',W/2,183);
 }
}
function addObstacle(){
 const types=['urn','pillar','rocks','column','statue'];const type=types[Math.floor(Math.random()*types.length)];
 const dims={urn:[70,68],pillar:[70,80],rocks:[95,48],column:[112,62],statue:[82,86]}[type];
 obstacles.push({type,x:W+30,y:G-dims[1],w:dims[0],h:dims[1]});
}
function start(){
 mode='run';time=0;score=0;speed=350;spawnIn=.9;obstacles=[];playerY=0;vy=0;runFrame=0;bg=0;
 overlay.style.display='none';overlay.classList.remove('retro-overlay');stateEl.textContent='RUNNING';last=performance.now();requestAnimationFrame(loop);
}
function jump(){
 if(mode!=='run')return;
 if(playerY===0){vy=-720;playerY=-1;playJumpSound()}
}
function hit(a,b){
 // Visual sprite is deliberately larger than its collision body.
 // Keep the hitbox around the pair's lower body so hair, cloaks and empty
 // transparent sprite margins do not cause premature collisions.
 const ax=158, ay=G-96+playerY, aw=112, ah=88;
 const bx=b.x+Math.max(10,b.w*.16), by=b.y+Math.max(7,b.h*.12);
 const bw=b.w-Math.max(20,b.w*.32), bh=b.h-Math.max(10,b.h*.18);
 return ax+aw>bx&&ax<bx+bw&&ay+ah>by&&ay<by+bh;
}
function gameOver(){
 mode='dead';stateEl.textContent='FALLEN';
 best=Math.max(best,Math.floor(score));try{localStorage.setItem('mystia-best',String(best))}catch(e){}
 bestEl.textContent=String(best).padStart(5,'0');draw();
 overlay.classList.add('retro-overlay');overlay.innerHTML='<div class="retro-dialog"><div class="retro-title"><span>Mystia - Game Over</span><span class="x">×</span></div><div class="retro-body"><div class="retro-icon">!</div><div class="retro-copy"><h1>GAME OVER</h1><p>항구에서 발을 헛디뎠습니다.<br>기록: '+Math.floor(score)+' m<br><br>다시 도전하시겠습니까?</p></div></div><div class="retro-actions"><button class="retro-btn" id="again">다시 시작(R)</button></div></div>'; 
 overlay.style.display='flex';document.getElementById('again').addEventListener('click',start);
}
function loop(now){
 if(mode!=='run')return;
 const dt=Math.min((now-last)/1000,.032);last=now;time+=dt;runFrame+=dt;score+=speed*dt/12;
 speed=Math.min(680,350+score*.32);bg+=speed*dt;
 playerY+=vy*dt;vy+=1900*dt;if(playerY>0){playerY=0;vy=0}
 spawnIn-=dt;if(spawnIn<=0){addObstacle();spawnIn=Math.max(.72,1.3+Math.random()*.55-score/1800)}
 for(const o of obstacles)o.x-=speed*dt;
 obstacles=obstacles.filter(o=>o.x+o.w>-10);
 for(const o of obstacles){if(hit(null,o)){gameOver();return}}
 distanceEl.textContent=String(Math.floor(score)).padStart(5,'0');
 draw();requestAnimationFrame(loop);
}
document.getElementById('start').addEventListener('click',start);
document.getElementById('screen').addEventListener('pointerdown',e=>{if(mode==='run'){e.preventDefault();jump()}});
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(mode==='ready')start();else jump()}});
draw();
})();
</script>
</body></html>
